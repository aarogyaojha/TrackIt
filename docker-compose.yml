services:
  mongo:
    image: mongo:7
    container_name: trackit-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --eval "db.runCommand({ ping: 1 })" --quiet']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo-init:
    image: mongo:7
    container_name: trackit-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    command: >
      mongosh --host mongo:27017 --eval '
        try {
          const status = rs.status();
          console.log("Replica set already initialized:", status.set);
        } catch (err) {
          console.log("Initializing replica set rs0...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "localhost:27017" }]
          });
          console.log("Replica set rs0 successfully initiated.");
        }
      '

volumes:
  mongo-data:
